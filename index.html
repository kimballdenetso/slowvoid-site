<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slowvoid</title>
  <meta name="description" content="Official site of Slowvoid — listen to tracks, dig into the mix, and leave a comment right where it hits.">

  <!-- Ubuntu Mono (Google Font) — see css/base.css's font-loading comment
       for why this lives here instead of an @import in the stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Load order matters: chrome.css and responsive.css load LAST so
       their overrides win over the individual feature stylesheets. -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/playlist.css">
  <link rel="stylesheet" href="css/eq.css">
  <link rel="stylesheet" href="css/dj-filter.css">
  <link rel="stylesheet" href="css/comments.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/visualizer3d.css">
  <link rel="stylesheet" href="css/chrome.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Three.js via CDN ESM builds, per visualizer3d.js's comment header
       — no bundler/build step, works as-is on Bluehost/MAMP. Pin the
       version so the "three" and "three/addons/" specifiers used inside
       visualizer3d.js resolve consistently; bump both paths together
       if you upgrade. Must appear before the module script that imports
       from these bare specifiers. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Reusable vector wordmark for the two side strips below — defined
       once, referenced twice via <use>, so we're not depending on the
       Brevis font or -webkit-text-stroke (the same cross-browser
       fragility that bit the EQ sliders, per project-plan.md Section 8,
       shows up with text-stroke on font glyphs too). Pure paths, no
       font dependency. Stroke color comes from CSS `color` via
       currentColor — see css/chrome.css .side-text. -->

      </mask>

    </symbol>
  </svg>

  <!-- Solid black desktop side panels — hidden on mobile, shown once the
       viewport has room to snap the page to 2x width (see
       css/responsive.css, 900px breakpoint). Square corners, no radius. -->
  <div class="side-panel side-panel--left" aria-hidden="true"></div>

  <!-- Was a plain black filler div — now also hosts the admin comment
       editor (js/admin.js, css/admin.css). Still the same black panel,
       hidden below the 900px desktop breakpoint per responsive.css, so
       the editor is desktop-only for free; admin.js adds a belt-and-
       braces JS check too, since a resize/devtools override could
       otherwise reveal it under 900px. Closed by default — opened via
       the "Admin" button in the header (site-header). -->
  <div class="side-panel side-panel--right">
    <section class="admin-panel" id="admin-panel" aria-label="Comment admin" hidden>

      <!-- Shown until a valid admin session exists. Posts to
           api/admin_login.php (new endpoint — see project-plan.md
           Section 3.6/5 for the existing password-gated admin.php
           plan; this is the same password check, just returning a
           token for JS instead of rendering server-side HTML). -->
      <form class="admin-panel__login" id="admin-login-form">
        <h3 class="admin-panel__title">Admin</h3>
        <label class="visually-hidden" for="admin-password">Password</label>
        <input
          class="admin-panel__input"
          id="admin-password"
          name="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >
        <button class="btn" type="submit">Log in</button>
        <p class="admin-panel__error" id="admin-login-error" hidden></p>
      </form>

      <!-- Shown once logged in. Lists every comment across every track
           (api/comments_all.php — new endpoint, admin-token protected)
           with inline edit + delete. Edit posts to api/comments_edit.php
           (new); delete reuses the existing api/comments_delete.php,
           extended to accept an admin_token alongside the visitor
           owner_token, per project-plan.md's "delete button that calls
           comments_delete.php with a matching admin token." -->
      <div class="admin-panel__editor" id="admin-editor" hidden>
        <div class="admin-panel__header">
          <h3 class="admin-panel__title">Comments</h3>
          <button class="btn btn--quiet" type="button" id="admin-logout">Log out</button>
        </div>
        <ul class="admin-panel__list" id="admin-comment-list">
          <!-- admin.js renders <li class="admin-comment"> rows here -->
        </ul>
      </div>

    </section>
  </div>

  <!-- Decorative, aria-hidden vertical wordmark strips (see
       css/chrome.css) — now rendered from the vector symbol above
       instead of live text, and layered on top of the whole page. -->
  <div class="side-text-wrap side-text-wrap--left" aria-hidden="true">
    <svg class="side-text" viewBox="0 0 99 604" focusable="false"><use href="#slowvoid-mark"></use></svg>
  </div>
  <div class="side-text-wrap side-text-wrap--right" aria-hidden="true">
    <svg class="side-text" viewBox="0 0 99 604" focusable="false"><use href="#slowvoid-mark"></use></svg>
  </div>

  <!-- Shared audio element — no native controls; every control on the
       page is custom (player.js / eq.js / panner-volume.js) and drives
       this element directly. main.js swaps its `src` on track change. -->
  <audio id="track-audio" preload="metadata"></audio>

  <!-- PAGE SHELL — the three organizing panels (header / player /
       comments). This is purely structural: every control below is the
       exact same markup/classes as before, just re-grouped. See
       css/chrome.css "PAGE SHELL & PANELS" for the 420px-fixed-width,
       rounded-corner, 3px-gap treatment. -->
  <div class="page-shell">

    <!-- PANEL 1: HEADER — logo + streaming/social link grid -->
    <div class="panel panel--header">
      <header class="site-header">
        <img class="site-header__logo" src="assets/images/logo.png" alt="Slowvoid">
        <nav class="site-header__links" aria-label="Listen and follow">
          <!-- social.js renders one .btn link per platform here -->
        </nav>
      </header>
    </div>

    <!-- PANEL 2: PLAYER — a base "stage" (visualizer + persistent
         transport) with the track list, EQ, volume/pan, and spectrum
         meter as floating overlay cards toggled on top of it. -->
    <div class="panel panel--player">
      <main class="player-panel-inner">

        <!-- BASE LAYER: interactive 3D model, now the background for
             the whole player panel (not just the compact controls
             strip below) — replacing the static device.png. Markup
             contract per visualizer3d.css's header comment. -->
        <section class="visualizer3d" aria-hidden="true">
          <canvas class="visualizer3d__canvas"></canvas>
        </section>

        <!-- TOP CHILD SECTION: every feature panel (tracklist/EQ/
             filter/volume/spectrum), grouped here as "features" for
             easy reference as a set. Each one keeps its own existing
             id/data-panel/positioning — js/panels.js and js/eq.js find
             them exactly the same way as before — this is a grouping
             wrapper only, not a rename of those. It isn't positioned
             itself, so each child's own position:absolute still
             resolves against .player-panel-inner (this wrapper's
             nearest positioned ancestor) exactly as it did against
             .player-stage before. -->
        <div class="features">

          <!-- FEATURE: track list (see css/playlist.css — items
               generated by playlist.js) -->
          <div class="floating-panel is-open" id="panel-tracklist" data-panel="tracklist">
            <section class="playlist" aria-label="Track list">
              <ul class="playlist__list" role="list">
                <!-- playlist.js renders <li class="playlist__item"> items here -->
              </ul>
            </section>
          </div>

          <!-- FEATURE: EQ (see css/eq.css for the full markup
               contract — bands are generated into .eq__bands by eq.js,
               only the reset button's column exists up front) -->
          <div class="floating-panel" id="panel-eq" data-panel="eq">
            <section class="eq" aria-label="10-band equalizer">
              <div class="eq__bands" role="group" aria-label="Frequency bands">
                <div class="eq__band eq__band--reset">
                  <button class="btn btn--icon" data-action="eq-reset" aria-label="Reset EQ to flat">
                    <svg class="player__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 13c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 8.74A7.93 7.93 0 0 0 4 13c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                  </button>
                </div>
              </div>
            </section>
          </div>

          <!-- FEATURE: DJ-style filter — three knobs (Amount/
               Frequency/Q) driving js/dj-filter.js's lowpass↔highpass
               sweep + wet-dry blend, spliced into the audio chain
               between the EQ and volume/pan stages (see js/main.js's
               buildAudioGraph). dj-filter.js wires the drag/keyboard
               behavior and rotation itself by querying these
               [data-knob] elements; only the markup lives here. -->
          <div class="floating-panel" id="panel-filter" data-panel="filter">
            <section class="dj-filter" aria-label="DJ filter">
              <div class="dj-filter__knob" data-knob="amount" role="slider" tabindex="0"
                   aria-label="Filter amount" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-valuetext="0%">
                <svg class="dj-filter__knob-track" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
                  <path d="M9.48 45 A26 26 0 1 1 54.52 45"></path>
                </svg>
                <div class="dj-filter__knob-dial"><span class="dj-filter__knob-indicator"></span></div>
                <span class="dj-filter__knob-label" aria-hidden="true">A</span>
              </div>
              <div class="dj-filter__knob" data-knob="freq" role="slider" tabindex="0"
                   aria-label="Filter cutoff — left is low-pass, right is high-pass, center is off"
                   aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" aria-valuetext="Off (flat)">
                <svg class="dj-filter__knob-track" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
                  <path d="M9.48 45 A26 26 0 1 1 54.52 45"></path>
                </svg>
                <div class="dj-filter__knob-dial"><span class="dj-filter__knob-indicator"></span></div>
                <span class="dj-filter__knob-label" aria-hidden="true">F</span>
              </div>
              <div class="dj-filter__knob" data-knob="q" role="slider" tabindex="0"
                   aria-label="Filter resonance" aria-valuemin="0.1" aria-valuemax="24" aria-valuenow="1" aria-valuetext="1.0">
                <svg class="dj-filter__knob-track" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
                  <path d="M9.48 45 A26 26 0 1 1 54.52 45"></path>
                </svg>
                <div class="dj-filter__knob-dial"><span class="dj-filter__knob-indicator"></span></div>
                <span class="dj-filter__knob-label" aria-hidden="true">Q</span>
              </div>
            </section>
          </div>

          <!-- FEATURE: volume / balance — looked up globally (by
               panner-volume.js), unchanged markup -->
          <div class="floating-panel" id="panel-volume" data-panel="volume">
            <div class="player__levels" aria-label="Volume and balance">
              <div class="player__control">
                <label class="player__control-label" for="volume">Vol</label>
                <input class="player__range player__range--volume" id="volume" type="range"
                       min="0" max="100" value="80" />
              </div>
              <div class="player__control">
                <label class="player__control-label" for="pan">Bal</label>
                <input class="player__range player__range--pan" id="pan" type="range"
                       min="-1" max="1" value="0" step="0.01" />
              </div>
            </div>
          </div>

          <!-- FEATURE: spectrum analyzer — same .eq__visualizer-canvas
               eq-visualizer.js already draws to, just relocated into
               its own floating card -->
          <div class="floating-panel" id="panel-spectrum" data-panel="spectrum">
            <section class="eq-meter" aria-hidden="true">
              <canvas class="eq__visualizer-canvas"></canvas>
            </section>
          </div>

        </div>

        <!-- BOTTOM CHILD SECTION: .player-stage now holds only the
             controls — anchored to the bottom of .player-panel-inner
             and sized to fit just this content, instead of forcing a
             tall min-height the way it did when the 3D model lived
             inside it. player.js finds the buttons/scrub-input/time
             span below via a scoped query on the .player element, so
             everything it needs stays inside that one section
             regardless of how the rows are grouped visually. -->
        <div class="player-stage">
          <section class="player" aria-label="Music player">

            <!-- ROW 1: two inline groups — player controls (transport
                 buttons) and the feature toggle buttons — with a gap
                 between them (.player__row--top's own gap, see
                 player.css). Each group's own internal spacing is
                 separate: the toggle buttons stay flush against each
                 other with no gap (see .player-toggles in chrome.css). -->
            <div class="player__row player__row--top">
              <div class="player__transport" role="group" aria-label="Playback controls">
                <button class="btn btn--icon" data-action="prev" aria-label="Previous track">
                  <svg class="player__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h2v16H6zM20 4L9 12l11 8z"/></svg>
                </button>
                <button class="btn btn--icon" data-action="play" aria-label="Play" aria-pressed="false">
                  <svg class="player__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>
                </button>
                <button class="btn btn--icon" data-action="pause" aria-label="Pause">
                  <svg class="player__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
                </button>
                <button class="btn btn--icon" data-action="stop" aria-label="Stop">
                  <svg class="player__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
                </button>
                <button class="btn btn--icon" data-action="next" aria-label="Next track">
                  <svg class="player__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4h2v16h-2zM4 4l11 8-11 8z"/></svg>
                </button>
              </div>

              <!-- The four panel-toggle buttons (LIST/EQ/VIZ/FILTER).
                   js/panels.js finds these the same way it always did
                   — by the shared .panel-toggle class and
                   [data-panel-toggle] attribute, not by their
                   container — so this group's position doesn't need
                   any JS changes. -->
              <div class="player-toggles" role="group" aria-label="Player features">
                <button class="btn player__feature-toggle panel-toggle" type="button" data-panel-toggle="tracklist" aria-expanded="true" aria-controls="panel-tracklist">LIST</button>
                <button class="btn player__feature-toggle panel-toggle" type="button" data-panel-toggle="eq" aria-expanded="false" aria-controls="panel-eq">EQ</button>
                <button class="btn player__feature-toggle panel-toggle" type="button" data-panel-toggle="spectrum" aria-expanded="false" aria-controls="panel-spectrum">VIZ</button>
                <!-- Stub: no panel content/wiring yet, see #panel-filter above. -->
                <button class="btn player__feature-toggle panel-toggle" type="button" data-panel-toggle="filter" aria-expanded="false" aria-controls="panel-filter">FILTER</button>
              </div>
            </div>

            <!-- ROW 2: progress bar — its own row, full width, below
                 the inline group above rather than bundled inside it. -->
            <div class="player__row player__row--progress">
              <div class="player__timeline">
                <input
                  class="player__scrub-input"
                  type="range"
                  min="0" max="100" value="0" step="0.1"
                  aria-label="Seek"
                />
                <!-- comments.js renders its timestamp markers into this
                     timeline; left in place unchanged from before. -->
              </div>
              <span class="player__time" data-time="total">0:00</span>
            </div>

          </section>
        </div>

      </main>
    </div>

    <!-- PANEL 3: COMMENTS -->
    <div class="panel panel--comments">
      <section class="container comments" aria-label="Track comments">
        <h3 class="comments__title">Track Comments</h3>


        <form class="comment-form" novalidate>
          <!-- Honeypot: real visitors never see or fill this (hidden via
               comments.css, not display:none — see that file's comment) -->
          <input type="text" class="comment-form__honeypot" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <input type="hidden" name="timestamp" value="0">

          <!-- Terminal-style prompt: live track time + name + comment,
               all on one line, mirroring the posted comment format
               (time [name] text). Time ticks live off #track-audio
               while both fields are empty, and freezes the moment the
               visitor starts typing (or clicks the timeline) — see
               comments.js's liveMode logic. -->
          <div class="comment-form__row comment-form__row--prompt">
            <span class="comment-form__timestamp" aria-hidden="true">0:00</span>
            <label class="visually-hidden" for="comment-name">Name</label>
            <input
              class="comment-form__input comment-form__input--name"
              id="comment-name"
              name="name"
              type="text"
              placeholder="Name"
              maxlength="10"
              required
            >
            <label class="visually-hidden" for="comment-text">Comment</label>
            <input
              class="comment-form__input comment-form__input--prompt"
              id="comment-text"
              name="comment"
              type="text"
              placeholder="Enter comment"
              maxlength="40"
              required
            >
          </div>

          <button class="btn" type="submit">Post</button>
        </form>

        <ul class="comments__list">
          <!-- comments.js renders <li class="comment"> items here -->
        </ul>
      </section>

      <!-- FOOTER -->
      <footer class="site-footer">
        <a href="mailto:booking@slowvoid.com">booking@slowvoid.com</a>
      </footer>
    </div>

  </div>

  <!-- main.js imports player.js, eq.js, spectrum-analyzer.js, panner-volume.js,
       playlist.js, and comments.js directly. social.js and parallax.js are
       fully independent (by design) and load as their own modules.
       panels.js is new and only handles opening/closing the floating
       overlay cards above — it doesn't touch audio or player state. -->
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/social.js"></script>
  <script type="module" src="js/parallax.js"></script>
  <script type="module" src="js/panels.js"></script>
  <script type="module" src="js/admin.js"></script>
  <script type="module" src="js/visualizer3d.js"></script>

</body>
</html>
